services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-keyforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keyforge}
      POSTGRES_DB: ${POSTGRES_DB:-keyforge}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keyforge} -d ${POSTGRES_DB:-keyforge}"]
      interval: 5s
      timeout: 5s
      retries: 12

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      ISSUER_URL: ${ISSUER_URL:-https://id.localtest.me}
      RP_ID: ${RP_ID:-id.localtest.me}
      RP_ORIGIN: ${RP_ORIGIN:-https://id.localtest.me}
      RP_NAME: ${RP_NAME:-keyforge}
      DATABASE_URL: postgresql://${POSTGRES_USER:-keyforge}:${POSTGRES_PASSWORD:-keyforge}@postgres:5432/${POSTGRES_DB:-keyforge}?schema=public
      DEV_LOGIN_STUB: ${DEV_LOGIN_STUB:-true}
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY:-dev-only-change-me-please-32chars-min-aaaaaa}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me-please-32chars-min-bbbbbb}
      COOKIE_SECRET: ${COOKIE_SECRET:-dev-only-change-me-please-32chars-min-cccccc}
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./apps/web/dist:/usr/share/nginx/html:ro

  web:
    image: node:22-bookworm-slim
    profiles: ["full"]
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm --filter @keyforge/web dev --host"
    environment:
      VITE_ISSUER_URL: ${ISSUER_URL:-https://id.localtest.me}
    volumes:
      - .:/app
    expose:
      - "5173"

volumes:
  pgdata:
