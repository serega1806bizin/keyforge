events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  client_max_body_size 1m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types application/json application/javascript text/css image/svg+xml application/wasm;

  upstream keyforge_server { server server:3000; }

  server {
    listen 80;
    server_name id.localtest.me;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name id.localtest.me;

    ssl_certificate     /etc/nginx/certs/id.localtest.me.pem;
    ssl_certificate_key /etc/nginx/certs/id.localtest.me-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(healthz|readyz|authorize|token|userinfo|revoke|introspect|logout|webauthn|account|admin|interaction|\.well-known) {
      proxy_pass http://keyforge_server;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      try_files $uri /index.html;
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }
  }
}
